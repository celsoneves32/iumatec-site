name: IUMATEC - Auditoria diaria segura Alltron Supabase Shopify

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      mode:
        description: Apenas auditoria (0 alteracoes)
        required: true
        default: audit
        type: choice
        options:
          - audit

permissions:
  contents: read

concurrency:
  group: iumatec-safe-shopify-sync
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALLTRON_HOST: ${{ secrets.ALLTRON_HOST }}
      ALLTRON_USER: ${{ secrets.ALLTRON_USER }}
      ALLTRON_PASS: ${{ secrets.ALLTRON_PASS }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_ADMIN_API_VERSION: "2026-10"
      SHOPIFY_LOCATION_ID: ${{ secrets.SHOPIFY_LOCATION_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      IUMATEC_STOCK_APPLY_APPROVED: "NAO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate scripts and required credentials
        shell: bash
        run: |
          node --check scripts/assert-safe-audit-reports.mjs
          for key in ALLTRON_HOST ALLTRON_USER ALLTRON_PASS SHOPIFY_STORE_DOMAIN SHOPIFY_ADMIN_ACCESS_TOKEN SHOPIFY_LOCATION_ID SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Load PRIVATE supplier ownership snapshot (no prices)
        run: node scripts/iumatec-restore-owner-snapshot.mjs
      - name: Audit current Alltron feed against Supabase (read-only)
        run: node scripts/sync-alltron-price-stock-to-supabase.mjs --limit=25

      - name: Verify Alltron report and fail on safety violations
        run: node scripts/assert-safe-audit-reports.mjs alltron

      - name: Audit Shopify protected variants (read-only)
        run: node scripts/auto-sync.mjs --limit=25

      - name: Verify Shopify report and fail on safety violations
        run: node scripts/assert-safe-audit-reports.mjs shopify

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iumatec-daily-audit-${{ github.run_id }}
          path: |
            integrations/alltron/out/alltron-supabase-sync/latest.json
            integrations/alltron/out/shopify-price-stock-sync/latest.json
            integrations/alltron/out/shopify-price-stock-sync/auto-sync.log
          if-no-files-found: warn
          retention-days: 30